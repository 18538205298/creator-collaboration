{% extends "admin/base.html" %}

{% block title %}管理员 - 内容管理{% endblock %}

{% block dashboard_content %}
<div class="container-fluid mt-4">
    <h2>内容管理</h2>
    
    <!-- 横向导航栏 -->
    <ul class="nav nav-tabs mt-3">
        <li class="nav-item">
            <a class="nav-link {% if active_tab == 'ad_tasks' %}active{% endif %}" href="{{ url_for('admin.content_management_ad_tasks') }}">
                <i class="bi bi-megaphone"></i> 广告任务列表
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link {% if active_tab == 'advertiser_requests' %}active{% endif %}" href="{{ url_for('admin.content_management_advertiser_requests') }}">
                <i class="bi bi-arrow-right-circle"></i> 广告主合作请求
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link {% if active_tab == 'collaborator_requests' %}active{% endif %}" href="{{ url_for('admin.content_management_collaborator_requests') }}">
                <i class="bi bi-arrow-left-circle"></i> 合作者合作请求
            </a>
        </li>
    </ul>
    
    <div class="tab-content mt-3">
        {% block tab_content %}{% endblock %}
    </div>
</div>
{% endblock %}
