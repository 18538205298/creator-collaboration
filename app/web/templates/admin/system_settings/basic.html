{% extends "admin/system_settings/base.html" %}

{% block tab_content %}
<div class="profile-info-card">
    <div class="card-header d-flex justify-content-between align-items-center">
        <h5 class="mb-0">默认头像设置</h5>
        <a href="{{ url_for('index.index') }}" class="profile-action-btn">
            <i class="bi bi-box-arrow-left"></i> 返回首页
        </a>
    </div>
    <div class="card-body">
        <div class="row">
            <!-- 广告主默认头像 -->
            <div class="col-md-6 mb-4">
                <div class="profile-inner-card">
                    <div class="profile-inner-card-header">
                        <div class="profile-inner-card-icon">
                            <i class="bi bi-buildings"></i>
                        </div>
                        <h5 class="profile-inner-card-title">广告主默认头像</h5>
                    </div>
                    <div class="profile-inner-card-content text-center">
                        <div class="profile-avatar-container mx-auto">
                            <img src="{{ url_for('static', filename='img/default_advertiser.png') }}" alt="广告主默认头像" class="profile-avatar">
                        </div>
                        <form action="{{ url_for('admin.update_default_avatar', user_type='advertiser') }}" method="POST" enctype="multipart/form-data" class="mt-4">
                            <div class="upload-btn-wrapper">
                                <button class="profile-action-btn" onclick="document.getElementById('advertiser-avatar').click(); return false;">
                                    <i class="bi bi-upload"></i> 上传新头像
                                </button>
                                <input type="file" name="avatar_file" id="advertiser-avatar" accept="image/png" style="display: none;" onchange="showFileName('advertiser-avatar', 'advertiser-file-name')">
                            </div>
                            <div id="advertiser-file-name" class="mt-2 small text-muted"></div>
                            <div class="mt-3">
                                <button type="submit" class="profile-action-btn">
                                    <i class="bi bi-check-circle"></i> 保存更改
                                </button>
                            </div>
                            <div class="mt-2 small text-muted">
                                注意：仅支持PNG格式，建议尺寸200x200像素
                            </div>
                        </form>
                    </div>
                </div>
            </div>
            
            <!-- 合作者默认头像 -->
            <div class="col-md-6 mb-4">
                <div class="profile-inner-card">
                    <div class="profile-inner-card-header">
                        <div class="profile-inner-card-icon">
                            <i class="bi bi-person"></i>
                        </div>
                        <h5 class="profile-inner-card-title">合作者默认头像</h5>
                    </div>
                    <div class="profile-inner-card-content text-center">
                        <div class="profile-avatar-container mx-auto">
                            <img src="{{ url_for('static', filename='img/default_collaborator.png') }}" alt="合作者默认头像" class="profile-avatar">
                        </div>
                        <form action="{{ url_for('admin.update_default_avatar', user_type='collaborator') }}" method="POST" enctype="multipart/form-data" class="mt-4">
                            <div class="upload-btn-wrapper">
                                <button class="profile-action-btn" onclick="document.getElementById('collaborator-avatar').click(); return false;">
                                    <i class="bi bi-upload"></i> 上传新头像
                                </button>
                                <input type="file" name="avatar_file" id="collaborator-avatar" accept="image/png" style="display: none;" onchange="showFileName('collaborator-avatar', 'collaborator-file-name')">
                            </div>
                            <div id="collaborator-file-name" class="mt-2 small text-muted"></div>
                            <div class="mt-3">
                                <button type="submit" class="profile-action-btn">
                                    <i class="bi bi-check-circle"></i> 保存更改
                                </button>
                            </div>
                            <div class="mt-2 small text-muted">
                                注意：仅支持PNG格式，建议尺寸200x200像素
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function showFileName(inputId, targetId) {
    const input = document.getElementById(inputId);
    const target = document.getElementById(targetId);
    if (input.files && input.files[0]) {
        target.textContent = '已选择文件: ' + input.files[0].name;
    } else {
        target.textContent = '';
    }
}
</script>
{% endblock %}
