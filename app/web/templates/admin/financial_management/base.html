{% extends "admin/base.html" %}

{% block title %}管理员 - 财务管理{% endblock %}

{% block dashboard_content %}
<div class="container-fluid mt-4">
    <h2>财务管理</h2>
    
    <!-- 横向导航栏 -->
    <ul class="nav nav-tabs mt-3">
        <li class="nav-item">
            <a class="nav-link {% if active_tab == 'advertiser_transactions' %}active{% endif %}" href="{{ url_for('admin.financial_management_advertiser_transactions') }}">
                <i class="bi bi-megaphone"></i> 广告主交易记录
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link {% if active_tab == 'collaborator_transactions' %}active{% endif %}" href="{{ url_for('admin.financial_management_collaborator_transactions') }}">
                <i class="bi bi-people"></i> 合作者交易记录
            </a>
        </li>
    </ul>
    
    <div class="tab-content mt-3">
        {% block tab_content %}{% endblock %}
    </div>
</div>
{% endblock %}
