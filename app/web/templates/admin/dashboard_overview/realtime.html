{% extends "admin/dashboard_overview/base.html" %}

{% block title %}管理员 - 实时数据监控{% endblock %}

{% set active_tab = 'realtime' %}

{% block tab_content %}
<div class="container-fluid px-4 py-3">
   

    <!-- 实时活动流和统计图表 -->
    <div class="row">
        <!-- 左侧 - 最近活动流 -->
        <div class="col-xl-6 mb-4">
            <div class="profile-info-card" style="height: 400px; overflow-y: auto;">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span>最近活动</span>
                    <button class="btn btn-sm btn-outline-light" id="refresh-activities">
                        <i class="bi bi-arrow-repeat"></i> 刷新
                    </button>
                </div>
                <div class="card-body p-0">
                    <div class="list-group list-group-flush" id="recent-activities-list">
                        <div class="text-center py-4">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">加载中...</span>
                            </div>
                            <p class="mt-2 text-muted">正在加载活动数据...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 右侧 - 今日流量和操作统计 -->
        <div class="col-xl-6 mb-4">
            <div class="profile-info-card" style="height: 400px; overflow-y: auto;">
                <div class="card-header">
                    <span>今日活动分布</span>
                </div>
                <div class="card-body" style="height: 300px; display: flex; justify-content: center; align-items: center;">
                    <canvas id="realtime-activity-chart"></canvas>
                </div>
            </div>
        </div>
    </div>
    
    <div class="row">
        <!-- 左侧 - 实时用户分布 -->
        <div class="col-xl-6 mb-4">
            <div class="profile-info-card" style="height: 400px; overflow-y: auto;">
                <div class="card-header">用户在线分布</div>
                <div class="card-body" style="height: 300px; display: flex; justify-content: center; align-items: center;">
                    <canvas id="user-distribution-chart"></canvas>
                </div>
            </div>
        </div>
        
        <!-- 右侧 - 广告任务状态 -->
        <div class="col-xl-6 mb-4">
            <div class="profile-info-card" style="height: 400px; overflow-y: auto;">
                <div class="card-header">任务状态实时监控</div>
                <div class="card-body" style="height: 300px; display: flex; justify-content: center; align-items: center;">
                    <canvas id="task-status-chart"></canvas>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 最近交易记录 -->
    <div class="row">
        <div class="col-12 mb-4">
            <div class="profile-info-card" style="height: 500px; overflow-y: auto;">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span>最近交易记录</span>
                    <button class="btn btn-sm btn-outline-light" id="refresh-transactions">
                        <i class="bi bi-arrow-repeat"></i> 刷新
                    </button>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>交易ID</th>
                                    <th>用户</th>
                                    <th>类型</th>
                                    <th>金额</th>
                                    <th>描述</th>
                                    <th>状态</th>
                                    <th>时间</th>
                                </tr>
                            </thead>
                            <tbody id="recent-transactions-table">
                                <tr>
                                    <td colspan="7" class="text-center py-4">
                                        <div class="spinner-border text-primary" role="status">
                                            <span class="visually-hidden">加载中...</span>
                                        </div>
                                        <p class="mt-2 text-muted">正在加载交易数据...</p>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async function() {
    try {
        console.log('开始加载实时监控页面数据');
        
        // 加载实时统计数据
        await fetchDashboardStats();
        
        // 加载最近活动
        await fetchRecentActivities();
        
        // 加载最近交易
        await fetchRecentTransactions();
        
        // 加载活动分布图表
        await fetchActivityDistribution();
        
        // 加载用户分布图表
        await fetchUserDistribution();
        
        // 加载任务状态图表
        await fetchTaskStatus();
        
        // 设置定时刷新
        setInterval(fetchDashboardStats, 30000); // 每30秒刷新一次统计数据
        
        // 绑定刷新按钮事件
        document.getElementById('refresh-activities').addEventListener('click', fetchRecentActivities);
        document.getElementById('refresh-transactions').addEventListener('click', fetchRecentTransactions);
        
    } catch (error) {
        console.error('加载实时监控数据失败:', error);
        displayErrorMessage();
    }
});

async function fetchDashboardStats() {
    try {
        console.log('请求实时统计数据');
        const response = await fetch('/admin/api/dashboard/realtime/stats');
        if (!response.ok) {
            throw new Error(`实时统计数据请求失败: ${response.status} ${response.statusText}`);
        }
        const result = await response.json();
        console.log('实时统计数据:', result);
        
        if (result.success) {
            const data = result.data;
            // 更新顶部卡片数据
            document.getElementById('online-users-count').textContent = data.online_users;
            document.getElementById('today-activities-count').textContent = data.today_activities;
            document.getElementById('today-transactions-amount').textContent = '¥' + data.today_transactions_amount.toLocaleString();
            document.getElementById('ongoing-tasks-count').textContent = data.ongoing_tasks;
        }
    } catch (error) {
        console.error('获取仪表盘统计数据失败:', error);
        // 显示错误状态但不抛出异常，让页面继续加载其他部分
        document.querySelectorAll('.profile-stat-value').forEach(element => {
            element.innerHTML = '<span class="text-danger">加载失败</span>';
        });
    }
}

async function fetchRecentActivities() {
    try {
        const activitiesContainer = document.getElementById('recent-activities-list');
        activitiesContainer.innerHTML = `
            <div class="text-center py-4">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">加载中...</span>
                </div>
                <p class="mt-2 text-muted">正在加载活动数据...</p>
            </div>
        `;
        
        console.log('请求最近活动数据');
        const response = await fetch('/admin/api/dashboard/realtime/activities');
        if (!response.ok) {
            throw new Error(`最近活动数据请求失败: ${response.status} ${response.statusText}`);
        }
        const result = await response.json();
        console.log('最近活动数据:', result);
        
        if (result.success) {
            const activities = result.data;
            
            // 生成活动列表HTML
            let activitiesHtml = '';
            if (activities && activities.length > 0) {
                activities.forEach(activity => {
                    let iconClass = '';
                    let bgColor = '';
                    
                    // 根据活动类型设置不同的图标和颜色
                    switch (activity.type) {
                        case 'login':
                            iconClass = 'bi-box-arrow-in-right';
                            bgColor = 'bg-primary';
                            break;
                        case 'task_create':
                            iconClass = 'bi-plus-circle';
                            bgColor = 'bg-success';
                            break;
                        case 'task_update':
                            iconClass = 'bi-pencil';
                            bgColor = 'bg-warning';
                            break;
                        case 'collaboration':
                            iconClass = 'bi-people';
                            bgColor = 'bg-info';
                            break;
                        case 'transaction':
                            iconClass = 'bi-cash';
                            bgColor = 'bg-danger';
                            break;
                        default:
                            iconClass = 'bi-activity';
                            bgColor = 'bg-secondary';
                    }
                    
                    activitiesHtml += `
                        <div class="list-group-item list-group-item-action p-3">
                            <div class="d-flex w-100 align-items-center">
                                <div class="me-3">
                                    <span class="activity-icon ${bgColor} text-white rounded-circle d-inline-flex justify-content-center align-items-center" style="width: 40px; height: 40px;">
                                        <i class="bi ${iconClass}"></i>
                                    </span>
                                </div>
                                <div class="flex-grow-1">
                                    <div class="d-flex w-100 justify-content-between">
                                        <h6 class="mb-1">${activity.user}</h6>
                                        <small class="text-muted">${activity.time}</small>
                                    </div>
                                    <p class="mb-1">${activity.description}</p>
                                    <small>${activity.details}</small>
                                </div>
                            </div>
                        </div>
                    `;
                });
            } else {
                activitiesHtml = `
                    <div class="list-group-item text-center py-4">
                        <p class="text-muted mb-0">暂无活动记录</p>
                    </div>
                `;
            }
            
            activitiesContainer.innerHTML = activitiesHtml;
        } else {
            throw new Error('获取活动数据失败');
        }
    } catch (error) {
        console.error('获取最近活动数据失败:', error);
        document.getElementById('recent-activities-list').innerHTML = `
            <div class="list-group-item text-center py-4">
                <p class="text-danger mb-0">加载活动数据失败</p>
                <small class="text-muted">请尝试刷新</small>
            </div>
        `;
    }
}

async function fetchRecentTransactions() {
    try {
        const transactionsContainer = document.getElementById('recent-transactions-table');
        transactionsContainer.innerHTML = `
            <tr>
                <td colspan="7" class="text-center py-4">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">加载中...</span>
                    </div>
                    <p class="mt-2 text-muted">正在加载交易数据...</p>
                </td>
            </tr>
        `;
        
        console.log('请求最近交易数据');
        const response = await fetch('/admin/api/dashboard/realtime/transactions');
        if (!response.ok) {
            throw new Error(`最近交易数据请求失败: ${response.status} ${response.statusText}`);
        }
        const result = await response.json();
        console.log('最近交易数据:', result);
        
        if (result.success) {
            const transactions = result.data;
            
            // 生成交易记录表格HTML
            let transactionsHtml = '';
            if (transactions && transactions.length > 0) {
                transactions.forEach(tx => {
                    let statusBadge = '';
                    
                    switch (tx.status) {
                        case 'success':
                            statusBadge = '<span class="badge bg-success">成功</span>';
                            break;
                        case 'pending':
                            statusBadge = '<span class="badge bg-warning">处理中</span>';
                            break;
                        case 'failed':
                            statusBadge = '<span class="badge bg-danger">失败</span>';
                            break;
                        default:
                            statusBadge = '<span class="badge bg-secondary">未知</span>';
                    }
                    
                    transactionsHtml += `
                        <tr>
                            <td>${tx.id}</td>
                            <td>${tx.user}</td>
                            <td>${tx.type}</td>
                            <td class="${tx.amount > 0 ? 'text-success' : 'text-danger'}">${tx.amount > 0 ? '+' : ''}${tx.amount}</td>
                            <td>${tx.description}</td>
                            <td>${statusBadge}</td>
                            <td>${tx.time}</td>
                        </tr>
                    `;
                });
            } else {
                transactionsHtml = `
                    <tr>
                        <td colspan="7" class="text-center py-4">
                            <p class="text-muted mb-0">暂无交易记录</p>
                        </td>
                    </tr>
                `;
            }
            
            transactionsContainer.innerHTML = transactionsHtml;
        } else {
            throw new Error('获取交易数据失败');
        }
    } catch (error) {
        console.error('获取最近交易数据失败:', error);
        document.getElementById('recent-transactions-table').innerHTML = `
            <tr>
                <td colspan="7" class="text-center py-4">
                    <p class="text-danger mb-0">加载交易数据失败</p>
                    <small class="text-muted">请尝试刷新</small>
                </td>
            </tr>
        `;
    }
}

async function fetchActivityDistribution() {
    try {
        console.log('请求活动分布数据');
        const response = await fetch('/admin/api/dashboard/realtime/activity_distribution');
        if (!response.ok) {
            throw new Error(`活动分布数据请求失败: ${response.status} ${response.statusText}`);
        }
        const result = await response.json();
        console.log('活动分布数据:', result);
        
        if (result.success) {
            generateActivityDistributionChart(result.data);
        } else {
            throw new Error('获取活动分布数据失败');
        }
    } catch (error) {
        console.error('获取活动分布数据失败:', error);
        document.getElementById('realtime-activity-chart').parentNode.innerHTML = `
            <div class="alert alert-danger m-3">
                <h5 class="alert-heading">加载失败</h5>
                <p>无法获取活动分布数据</p>
            </div>
        `;
    }
}

async function fetchUserDistribution() {
    try {
        console.log('请求用户分布数据');
        const response = await fetch('/admin/api/dashboard/realtime/user_distribution');
        if (!response.ok) {
            throw new Error(`用户分布数据请求失败: ${response.status} ${response.statusText}`);
        }
        const result = await response.json();
        console.log('用户分布数据:', result);
        
        if (result.success) {
            generateUserDistributionChart(result.data);
        } else {
            throw new Error('获取用户分布数据失败');
        }
    } catch (error) {
        console.error('获取用户分布数据失败:', error);
        document.getElementById('user-distribution-chart').parentNode.innerHTML = `
            <div class="alert alert-danger m-3">
                <h5 class="alert-heading">加载失败</h5>
                <p>无法获取用户分布数据</p>
            </div>
        `;
    }
}

async function fetchTaskStatus() {
    try {
        console.log('请求任务状态数据');
        const response = await fetch('/admin/api/dashboard/realtime/task_status');
        if (!response.ok) {
            throw new Error(`任务状态数据请求失败: ${response.status} ${response.statusText}`);
        }
        const result = await response.json();
        console.log('任务状态数据:', result);
        
        if (result.success) {
            generateTaskStatusChart(result.data);
        } else {
            throw new Error('获取任务状态数据失败');
        }
    } catch (error) {
        console.error('获取任务状态数据失败:', error);
        document.getElementById('task-status-chart').parentNode.innerHTML = `
            <div class="alert alert-danger m-3">
                <h5 class="alert-heading">加载失败</h5>
                <p>无法获取任务状态数据</p>
            </div>
        `;
    }
}

function generateActivityDistributionChart(data) {
    const ctx = document.getElementById('realtime-activity-chart').getContext('2d');
    
    // 销毁旧图表（如果存在）
    if (window.activityDistributionChart) {
        window.activityDistributionChart.destroy();
    }
    
    // 默认数据（仅在API返回数据为空时使用）
    let chartData = {
        labels: ['登录', '任务创建', '任务更新', '合作申请', '交易', '消息', '查看资料'],
        counts: [0, 0, 0, 0, 0, 0, 0]
    };
    
    // 使用API返回的数据
    if (data && data.activity_types && data.activity_types.length > 0) {
        chartData.labels = data.activity_types.map(type => {
            // 美化活动类型名称显示
            switch(type) {
                case 'login': return '登录';
                case 'logout': return '登出';
                case 'task_create': return '任务创建';
                case 'task_update': return '任务更新';
                case 'task_delete': return '任务删除';
                case 'collaboration_request': return '合作申请';
                case 'collaboration_response': return '合作回应';
                case 'transaction': return '交易';
                case 'message': return '消息';
                case 'profile_view': return '查看资料';
                default: return type;
            }
        });
        chartData.counts = data.counts;
    }
    
    window.activityDistributionChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
            labels: chartData.labels,
            datasets: [{
                label: '活动次数',
                data: chartData.counts,
                backgroundColor: [
                    'rgba(75, 108, 183, 0.7)',
                    'rgba(17, 153, 142, 0.7)',
                    'rgba(252, 92, 125, 0.7)',
                    'rgba(248, 87, 166, 0.7)',
                    'rgba(255, 193, 7, 0.7)',
                    'rgba(19, 186, 254, 0.7)',
                    'rgba(169, 92, 232, 0.7)',
                    'rgba(255, 159, 64, 0.7)',
                    'rgba(153, 102, 255, 0.7)',
                    'rgba(201, 203, 207, 0.7)'
                ],
                borderWidth: 1
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    position: 'right',
                }
            }
        }
    });
}

function generateUserDistributionChart(data) {
    const ctx = document.getElementById('user-distribution-chart').getContext('2d');
    
    // 销毁旧图表（如果存在）
    if (window.userDistributionChart) {
        window.userDistributionChart.destroy();
    }
    
    // 默认数据（仅在API返回数据为空时使用）
    let chartData = {
        labels: ['广告主', '合作者', '游客', '管理员'],
        counts: [0, 0, 0, 0]
    };
    
    // 使用API返回的数据
    if (data && data.roles && data.roles.length > 0) {
        chartData.labels = data.roles.map(role => {
            // 美化角色名称显示
            switch(role) {
                case 'advertiser': return '广告主';
                case 'collaborator': return '合作者';
                case 'admin': return '管理员';
                case 'visitor': return '游客';
                default: return role;
            }
        });
        chartData.counts = data.counts;
    }
    
    window.userDistributionChart = new Chart(ctx, {
        type: 'pie',
        data: {
            labels: chartData.labels,
            datasets: [{
                label: '在线用户数',
                data: chartData.counts,
                backgroundColor: [
                    'rgba(75, 108, 183, 0.7)',
                    'rgba(17, 153, 142, 0.7)',
                    'rgba(252, 92, 125, 0.7)',
                    'rgba(248, 87, 166, 0.7)'
                ],
                borderWidth: 1
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    position: 'right',
                }
            }
        }
    });
}

function generateTaskStatusChart(data) {
    const ctx = document.getElementById('task-status-chart').getContext('2d');
    
    // 销毁旧图表（如果存在）
    if (window.taskStatusChart) {
        window.taskStatusChart.destroy();
    }
    
    // 默认数据（仅在API返回数据为空时使用）
    let chartData = {
        labels: ['草稿', '已发布', '进行中', '已完成', '已取消'],
        counts: [0, 0, 0, 0, 0]
    };
    
    // 使用API返回的数据
    if (data && data.statuses && data.statuses.length > 0) {
        chartData.labels = data.statuses.map(status => {
            // 美化状态名称显示
            switch(status) {
                case 'draft': return '草稿';
                case 'published': return '已发布';
                case 'in_progress': return '进行中';
                case 'completed': return '已完成';
                case 'cancelled': return '已取消';
                default: return status;
            }
        });
        chartData.counts = data.counts;
    }
    
    window.taskStatusChart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: chartData.labels,
            datasets: [{
                label: '任务数量',
                data: chartData.counts,
                backgroundColor: [
                    'rgba(108, 117, 125, 0.7)',
                    'rgba(0, 123, 255, 0.7)',
                    'rgba(255, 193, 7, 0.7)',
                    'rgba(40, 167, 69, 0.7)',
                    'rgba(220, 53, 69, 0.7)'
                ],
                borderWidth: 1
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    display: false
                }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    title: {
                        display: true,
                        text: '任务数量'
                    }
                }
            }
        }
    });
}

function displayErrorMessage() {
    const containers = document.querySelectorAll('.card-body');
    containers.forEach(container => {
        container.innerHTML = `
            <div class="alert alert-danger m-3" role="alert">
                <h5 class="alert-heading">加载数据失败</h5>
                <p>无法连接到服务器或获取数据。</p>
                <hr>
                <p class="mb-0">请检查网络连接或稍后重试。</p>
            </div>
        `;
    });
}
</script>
{% endblock %}
