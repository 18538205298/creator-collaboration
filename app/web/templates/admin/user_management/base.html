{% extends "admin/base.html" %}

{% block title %}管理员 - 用户管理{% endblock %}

{% block dashboard_content %}
<div class="container-fluid mt-4">
    <h2>用户管理</h2>
    
    <!-- 横向导航栏 -->
    <ul class="nav nav-tabs mt-3">
        <li class="nav-item">
            <a class="nav-link {% if active_tab == 'advertisers' %}active{% endif %}" href="{{ url_for('admin.user_management_advertisers') }}">
                <i class="bi bi-briefcase"></i> 广告主列表
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link {% if active_tab == 'collaborators' %}active{% endif %}" href="{{ url_for('admin.user_management_collaborators') }}">
                <i class="bi bi-person-badge"></i> 合作者列表
            </a>
        </li>

    </ul>
    
    <div class="tab-content mt-3">
        {% block tab_content %}{% endblock %}
    </div>
</div>
{% endblock %}
