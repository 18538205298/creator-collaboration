{% extends "advertiser/base.html" %}

{% block title %}广告主 - 寻找合作者{% endblock %}

{% block head %}
{{ super() }}
<link rel="stylesheet" href="{{ url_for('static', filename='css/advertiser/collaborator_search/style.css') }}">
{% endblock %}

{% block dashboard_content %}
<h2>寻找合作者</h2>

<!-- 横向导航栏 -->
<ul class="nav nav-tabs mb-4">
    <li class="nav-item">
        <a class="nav-link {% if active_tab == 'list' %}active{% endif %}" href="{{ url_for('advertiser.collaborator_search_list') }}">
            <i class="bi bi-people"></i> 合作者列表
        </a>
    </li>
    <li class="nav-item">
        <a class="nav-link {% if active_tab == 'favorites' %}active{% endif %}" href="{{ url_for('advertiser.collaborator_search_favorites') }}">
            <i class="bi bi-star"></i> 收藏合作者
        </a>
    </li>
    <li class="nav-item">
        <a class="nav-link {% if active_tab == 'history' %}active{% endif %}" href="{{ url_for('advertiser.collaborator_search_history') }}">
            <i class="bi bi-clock-history"></i> 浏览记录
        </a>
    </li>
</ul>

<!-- 内容区块 -->
<div class="collaborator-search-content">
    {% block collaborator_search_content %}
    <!-- 默认内容 -->
    <div class="alert alert-info">
        请从上方选择您要查看的内容
    </div>
    {% endblock %}
</div>
{% endblock %}
