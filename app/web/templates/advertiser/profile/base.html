{% extends "advertiser/base.html" %}

{% block title %}广告主 - 个人资料{% endblock %}

{% block head %}
{{ super() }}
<link rel="stylesheet" href="{{ url_for('static', filename='css/advertiser/profile/style.css') }}">
{% endblock %}

{% block dashboard_content %}
<h2>个人资料</h2>

<!-- 横向导航栏 -->
<ul class="nav nav-tabs mb-4">
    <li class="nav-item">
        <a class="nav-link {% if active_tab == 'basic' %}active{% endif %}" href="{{ url_for('advertiser.profile_basic') }}">
            <i class="bi bi-person-badge"></i> 基本资料
        </a>
    </li>
    <li class="nav-item">
        <a class="nav-link {% if active_tab == 'edit' %}active{% endif %}" href="{{ url_for('advertiser.profile_edit') }}">
            <i class="bi bi-pencil-square"></i> 信息修改
        </a>
    </li>
    <li class="nav-item">
        <a class="nav-link {% if active_tab == 'finance' %}active{% endif %}" href="{{ url_for('advertiser.profile_finance') }}">
            <i class="bi bi-wallet2"></i> 财产管理
        </a>
    </li>
</ul>

<!-- 内容区块 -->
<div class="profile-content">
    {% block profile_content %}
    <!-- 默认内容 -->
    <div class="alert alert-info">
        请从上方选择您要查看的内容
    </div>
    {% endblock %}
</div>
{% endblock %}
