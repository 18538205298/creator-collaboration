{% extends "base.html" %}

{% block title %}用户注册 - 广告传播合作平台{% endblock %}

{% block content %}
<div class="bg-light min-vh-100 d-flex align-items-center">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-7 col-xl-6">
                <div class="profile-info-card">
                    <div class="card-header">
                        <h4 class="mb-0 text-center">创建账号</h4>
                    </div>
                    <div class="card-body">
                        <div class="text-center mb-4">
                            <div class="profile-avatar-container mx-auto" style="width: 80px; height: 80px; background: linear-gradient(135deg, #a1c4fd, #c2e9fb);">
                                <div class="d-flex align-items-center justify-content-center h-100">
                                    <i class="bi bi-person-plus text-white" style="font-size: 2.5rem;"></i>
                                </div>
                            </div>
                            <p class="profile-info-label mt-3">加入我们的平台</p>
                        </div>

                        <form action="{{ url_for('index.register_submit') }}" method="post">
                            <div class="profile-stats-container mb-4">
                                <h6 class="profile-stats-title">选择账号类型</h6>
                                <div class="profile-stats-grid" style="grid-template-columns: repeat(2, 1fr);">
                                    <div class="profile-stat-card role-card" data-role="advertiser">
                                        <input type="radio" name="role" id="role_advertiser" value="advertiser" class="d-none" checked>
                                        <div class="role-icon-wrapper">
                                            <i class="bi bi-briefcase role-icon"></i>
                                        </div>
                                        <h5 class="mt-2">广告主</h5>
                                        <p class="small text-muted">适合需要投放广告的企业或个人</p>
                                    </div>
                                    <div class="profile-stat-card role-card" data-role="collaborator">
                                        <input type="radio" name="role" id="role_collaborator" value="collaborator" class="d-none">
                                        <div class="role-icon-wrapper">
                                            <i class="bi bi-people role-icon"></i>
                                        </div>
                                        <h5 class="mt-2">合作者</h5>
                                        <p class="small text-muted">适合拥有流量资源的个人或机构</p>
                                    </div>
                                </div>
                            </div>

                            <div class="profile-inner-card mb-3">
                                <label for="username" class="form-label">用户名</label>
                                <div class="input-group">
                                    <span class="input-group-text" style="background: linear-gradient(135deg, #3a7bd5, #00d2ff); color: white;">
                                        <i class="bi bi-person"></i>
                                    </span>
                                    <input type="text" class="form-control" id="username" name="username" placeholder="请输入用户名">
                                </div>
                                <div class="form-text small">用户名长度为4-20个字符，支持字母、数字和下划线</div>
                            </div>
                            
                            <div class="profile-inner-card mb-3">
                                <label for="email" class="form-label">电子邮箱</label>
                                <div class="input-group">
                                    <span class="input-group-text" style="background: linear-gradient(135deg, #3a7bd5, #00d2ff); color: white;">
                                        <i class="bi bi-envelope"></i>
                                    </span>
                                    <input type="email" class="form-control" id="email" name="email" placeholder="请输入电子邮箱">
                                </div>
                            </div>
                            
                            <div class="profile-inner-card mb-3">
                                <label for="phone" class="form-label">手机号码</label>
                                <div class="input-group">
                                    <span class="input-group-text" style="background: linear-gradient(135deg, #3a7bd5, #00d2ff); color: white;">
                                        <i class="bi bi-phone"></i>
                                    </span>
                                    <input type="tel" class="form-control" id="phone" name="phone_number" placeholder="请输入手机号码">
                                </div>
                            </div>
                            
                            <div class="profile-inner-card mb-3">
                                <label for="password" class="form-label">密码</label>
                                <div class="input-group">
                                    <span class="input-group-text" style="background: linear-gradient(135deg, #3a7bd5, #00d2ff); color: white;">
                                        <i class="bi bi-lock"></i>
                                    </span>
                                    <input type="password" class="form-control" id="password" name="password" placeholder="请输入密码">
                                </div>
                                <div class="form-text small">密码长度至少8位，包含大小写字母、数字和特殊符号</div>
                            </div>
                            
                            <div class="profile-inner-card mb-4">
                                <label for="confirm_password" class="form-label">确认密码</label>
                                <div class="input-group">
                                    <span class="input-group-text" style="background: linear-gradient(135deg, #3a7bd5, #00d2ff); color: white;">
                                        <i class="bi bi-lock-fill"></i>
                                    </span>
                                    <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="请再次输入密码">
                                </div>
                            </div>
                  
                            <div class="profile-actions">
                                <button type="submit" class="profile-action-btn w-100 d-flex justify-content-center align-items-center">
                                    <i class="bi bi-person-plus me-2"></i>立即注册
                                </button>
                            </div>
                            <div class="text-center mt-3">
                                <span class="small text-muted">已有账号？</span>
                                <a href="{{ url_for('index.login') }}" class="small">登录</a>
                            </div>
                        </form>
                    </div>
                </div>
                <div class="text-center mt-4">
                    <a href="{{ url_for('index.index') }}" class="text-primary small">
                        <i class="bi bi-arrow-left me-1"></i>返回首页
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.role-card {
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: all 0.3s ease;
    padding: 20px 15px;
}

.role-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, rgba(58, 123, 213, 0.2), rgba(0, 210, 255, 0.2));
    opacity: 0;
    transition: all 0.3s ease;
    z-index: 0;
}

.role-card:hover::before, .role-card.active::before {
    opacity: 1;
}

.role-card.active {
    border: 2px solid #3a7bd5;
    transform: translateY(-5px);
    box-shadow: 0 10px 25px rgba(58, 123, 213, 0.2);
}

.role-card > * {
    position: relative;
    z-index: 1;
}

.role-icon-wrapper {
    width: 50px;
    height: 50px;
    margin: 0 auto 10px;
    border-radius: 50%;
    background: linear-gradient(135deg, #3a7bd5, #00d2ff);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.5s ease;
    transform-style: preserve-3d;
}

.role-icon {
    font-size: 1.8rem;
    color: white;
}

.role-card:hover .role-icon-wrapper {
    transform: rotateY(180deg);
}

.role-card:hover .role-icon {
    transform: rotateY(-180deg);
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // 角色卡片选择功能
    const roleCards = document.querySelectorAll('.role-card');
    
    // 初始化选中状态
    document.querySelector('.role-card[data-role="advertiser"]').classList.add('active');
    
    roleCards.forEach(card => {
        card.addEventListener('click', function() {
            // 移除所有卡片的active状态
            roleCards.forEach(c => c.classList.remove('active'));
            
            // 添加当前卡片的active状态
            this.classList.add('active');
            
            // 选中对应的radio
            const role = this.dataset.role;
            document.querySelector(`#role_${role}`).checked = true;
        });
    });
});
</script>
{% endblock %}
